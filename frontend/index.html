<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProcurePilot AI — Autonomous Purchasing for Small Businesses</title>
    <meta name="description" content="Autonomous procurement agent for kirana stores, supermarkets, cafes and small offices. Natural language to validated purchase orders with PayPal checkout." />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="theme-color" content="#000000" />
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('procurepilot-ui');
          var theme = 'dark';
          if (stored) {
            var parsed = JSON.parse(stored);
            if (parsed && parsed.state && parsed.state.theme) {
              theme = parsed.state.theme;
            }
          }
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-background text-ink antialiased selection:bg-neutral-800 selection:text-white dark:selection:bg-white dark:selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
